<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milo — Pet Assistant</title>
<style>
:root{--bg:#f7f3e9;--paper:#fffdf8;--ink:#2e2d28;--muted:#89867b;--green:#708f78;--pale:#e7eee2;--line:#ded9cc;--tan:#efe2c9;--shadow:0 2px 7px #514b3b12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 52% 30%,#fffdf7 0,#f8f4e9 45%,#f2eee3 100%);color:var(--ink);font-family:Inter,ui-rounded,"Avenir Next",system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:120px}.top{height:105px;display:flex;align-items:center;padding:18px 30px;border-bottom:1px solid #ddd8cb;background:#faf7efcc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:22px;line-height:1.05}.mini-avatar,.avatar{overflow:hidden;border-radius:50%;background:#d8d2c5;display:grid;place-items:center}.mini-avatar{width:52px;height:52px}.mini-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.status{width:10px;height:18px;background:#9eb9a1;border-radius:8px;margin-left:-8px}.tagline{margin-left:10px;color:#7c796f;font-weight:700}.demo{margin-left:auto;border:1px solid #ddcfb7;background:var(--tan);padding:16px 25px;border-radius:38px;font-weight:700;color:#766b5d;cursor:pointer}.help{margin-left:20px;border:0;background:transparent;font-size:29px;color:#706e66;cursor:pointer}.hero{text-align:center;padding:44px 30px 18px}.avatar{width:170px;height:170px;margin:0 auto 26px;border:14px solid #f0ede4;box-shadow:var(--shadow)}.avatar .dog{font-size:95px;transform:translateY(8px)}.eyebrow{display:inline-flex;gap:9px;align-items:center;background:var(--pale);color:#66816c;padding:11px 20px;border-radius:25px;font-size:14px;font-weight:800;letter-spacing:.07em}.hero h1{font-size:54px;line-height:1.05;margin:30px 0 18px;letter-spacing:-.04em}.hero h1 span{color:var(--green)}.hero p{font-size:20px;line-height:1.6;color:#7d7a70;max-width:590px;margin:auto}.cards{padding:18px 30px;display:grid;gap:14px}.card{width:100%;border:1px solid var(--line);background:#fffdf9d9;border-radius:26px;padding:20px 20px;display:flex;align-items:center;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:.18s transform,.18s border-color,.18s box-shadow;color:inherit}.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:#9db29f;box-shadow:0 8px 20px #514b3b16;outline:none}.ico{width:54px;height:54px;border-radius:18px;background:var(--pale);display:grid;place-items:center;color:#678a72;font-size:25px;margin-right:17px;flex:0 0 auto}.copy b{display:block;font-size:18px;margin-bottom:4px}.copy small{font-size:14px;color:#999488}.chev{margin-left:auto;color:#9b978d;font-size:24px}.chat{position:fixed;inset:auto 0 0;z-index:10;pointer-events:none}.panel{pointer-events:auto;max-width:720px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:30px 30px 0 0;box-shadow:0 -10px 40px #423d3222;transform:translateY(105%);transition:.28s transform;max-height:76vh;display:flex;flex-direction:column}.chat.open .panel{transform:translateY(0)}.chat-head{display:flex;align-items:center;padding:20px 22px;border-bottom:1px solid #ebe6da}.chat-head strong{font-size:19px}.close{margin-left:auto;border:0;background:#efede5;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}.messages{padding:20px;overflow:auto;min-height:230px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:83%;padding:13px 16px;border-radius:19px;line-height:1.45}.bot{align-self:flex-start;background:#edf2e9}.user{align-self:flex-end;background:#e8dcc5}.composer{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #ebe6da}.composer input{flex:1;border:1px solid #d8d3c7;border-radius:24px;padding:13px 17px;font:inherit;background:white;outline:none}.composer input:focus{border-color:#8da391}.send{border:0;background:#718e77;color:white;border-radius:24px;padding:0 20px;font-weight:700;cursor:pointer}.toast{position:fixed;top:125px;left:50%;transform:translate(-50%,-20px);background:#32322e;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.top{height:82px;padding:12px 18px}.brand{font-size:17px}.mini-avatar{width:44px;height:44px}.tagline{display:none}.demo{padding:12px 15px;font-size:13px}.help{margin-left:10px}.hero{padding:32px 20px 10px}.avatar{width:145px;height:145px}.hero h1{font-size:42px}.hero p{font-size:17px}.cards{padding:16px 18px}.card{padding:16px;border-radius:22px}.copy b{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mini-avatar"><span style="font-size:31px">🐶</span></div><span>pet<br>assistant</span><i class="status"></i></div><div class="tagline">Your companion<br>is here</div><button class="demo" id="demoBtn">✣ &nbsp; DEMO MODE</button><button class="help" id="helpBtn" aria-label="Help">?</button></header>
<main><section class="hero"><div class="avatar"><div class="dog">🐕</div></div><div class="eyebrow">✣ &nbsp; HERE FOR THE EVERYDAY QUESTIONS</div><h1>Hi, I’m <span>Milo.</span></h1><p>A friendly place to think through the little things that make life with your pet feel easier.</p></section>
<section class="cards" aria-label="Conversation starters">
<button class="card" data-topic="routine"><span class="ico">▣</span><span class="copy"><b>Build a daily routine</b><small>Small habits, happier days</small></span><span class="chev">›</span></button>
<button class="card" data-topic="vet"><span class="ico">♧</span><span class="copy"><b>Getting ready for a vet visit</b><small>Make the trip less stressful</small></span><span class="chev">›</span></button>
<button class="card" data-topic="play"><span class="ico">♡</span><span class="copy"><b>Make playtime count</b><small>Ideas for curious pups</small></span><span class="chev">›</span></button>
<button class="card" data-topic="body"><span class="ico">⌁</span><span class="copy"><b>Understand body language</b><small>A little more tail-wag wisdom</small></span><span class="chev">›</span></button>
</section></main></div>
<div class="toast" id="toast"></div>
<div class="chat" id="chat"><section class="panel"><div class="chat-head"><strong id="chatTitle">Chat with Milo</strong><button class="close" id="closeChat">×</button></div><div class="messages" id="messages"></div><form class="composer" id="composer"><input id="messageInput" autocomplete="off" placeholder="Ask Milo anything…" aria-label="Message"><button class="send">Send</button></form></section></div>
<script>
const topics={routine:{title:'Build a daily routine',msg:'I can help you make a simple routine. What kind of pet do you have, and roughly what time does your day usually start?'},vet:{title:'Getting ready for a vet visit',msg:'A calmer vet trip starts before you leave home. Is this a routine checkup, a first visit, or is there a specific concern?'},play:{title:'Make playtime count',msg:'Let’s find play your pet actually enjoys. Tell me their age, energy level, and a toy or activity they already like.'},body:{title:'Understand body language',msg:'Describe what you’re seeing — ears, eyes, posture, tail, sounds, and what was happening right before it. I’ll help you think through the signals.'}};
const chat=document.querySelector('#chat'),messages=document.querySelector('#messages'),title=document.querySelector('#chatTitle'),input=document.querySelector('#messageInput'),toast=document.querySelector('#toast');
function add(text,who='bot'){const d=document.createElement('div');d.className='bubble '+who;d.textContent=text;messages.append(d);messages.scrollTop=messages.scrollHeight}
function openTopic(key){const t=topics[key];title.textContent=t.title;messages.innerHTML='';add(t.msg);chat.classList.add('open');setTimeout(()=>input.focus(),300)}
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>openTopic(b.dataset.topic)));
document.querySelector('#closeChat').onclick=()=>chat.classList.remove('open');
document.querySelector('#helpBtn').onclick=()=>{title.textContent='How Milo works';messages.innerHTML='';add('Choose one of the cards to start, or type a question below. This demo responds locally in your browser — no account or server is required.');chat.classList.add('open')};
document.querySelector('#demoBtn').onclick=()=>{toast.textContent='Demo mode is on — responses are generated locally.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2300)};
document.querySelector('#composer').addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v)return;add(v,'user');input.value='';setTimeout(()=>{const q=v.toLowerCase();let r='That’s helpful context. Keep an eye on patterns — what happens before the behavior, what your pet does, and how quickly they settle afterward.';if(q.includes('food')||q.includes('eat'))r='For feeding routines, consistency helps. Use portions appropriate for your pet and their food, keep fresh water available, and ask your veterinarian about major diet changes.';else if(q.includes('vet')||q.includes('doctor'))r='For a vet visit, bring medication details, relevant records, and notes about changes you’ve noticed. If symptoms seem urgent or severe, contact a veterinary professional rather than relying on this demo.';else if(q.includes('play')||q.includes('toy'))r='Try short, varied play sessions and stop while your pet is still interested. Sniffing, searching, tug, fetch, and simple training games can provide different kinds of enrichment.';else if(q.includes('tail')||q.includes('ear')||q.includes('body'))r='Read the whole body rather than one signal. Loose movement usually differs from a stiff posture; context, distance, ears, eyes, mouth, tail, and recovery afterward all matter.';add(r)},450)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')chat.classList.remove('open')});
</script>
</body></html>
